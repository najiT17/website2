<div class="overlay">
  <div class="modal">
    <button class="close" (click)="close.emit()">✕</button>

    <h1>
      {{ mode === 'signup' ? 'Create an account' : 'Login' }}
    </h1>

    @if (errorMessage()) {
      <p class="message error">{{ errorMessage() }}</p>
    }

    @if (successMessage()) {
      <p class="message success">{{ successMessage() }}</p>
    }

    <form (ngSubmit)="onSubmit()">
      <input
        type="text"
        placeholder="Username"
        [(ngModel)]="username"
        name="username"
        [disabled]="isLoading"
      />

      <input
        type="password"
        placeholder="Password"
        [(ngModel)]="password"
        name="password"
        [disabled]="isLoading"
      />

      <button type="submit" class="signup-btn" [disabled]="isLoading">
        {{ isLoading ? 'Loading...' : mode === 'signup' ? 'Sign up' : 'Login' }}
      </button>
    </form>

    <p class="switch-text">
      {{ mode === 'signup' ? 'Already have an account?' : "Don't have an account?" }}
      <span class="custom-link" (click)="switchMode.emit(mode === 'signup' ? 'login' : 'signup')">
        {{ mode === 'signup' ? 'Log in' : 'Sign up' }}
      </span>
    </p>
  </div>
</div>
