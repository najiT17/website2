<div class="overlay">
  <div class="modal">
    <button class="close" (click)="close.emit()">✕</button>

    <h1>
      {{ mode === 'signup' ? 'Create an account' : 'Login' }}
    </h1>
    
    @if (errorMessage()) {
      <p class="message error">{{ errorMessage() }}</p>
    }

    @if (successMessage()) {
      <p class="message success">{{ successMessage() }}</p>
    }
    
    

    <input
      type="text"
      placeholder="Username"
      [(ngModel)]="username"
      [disabled]="isLoading"
    />
    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password"
      [disabled]="isLoading"
    />

    <button class="signup-btn" (click)="onSubmit()" [disabled]="isLoading">
      {{ isLoading ? 'Loading...' : (mode === 'signup' ? 'Sign up' : 'Login') }}
    </button>
    <p class="switch-text">
      {{ mode === 'signup'
          ? 'Already have an account?'
          : "Don't have an account?" }}
      <span class="custom-link" (click)="switchMode.emit(mode === 'signup' ? 'login' : 'signup')">
        {{ mode === 'signup' ? 'Log in' : 'Sign up' }}
      </span>
    </p>
  </div>
</div>
